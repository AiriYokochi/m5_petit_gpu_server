[project]
name = "m5-petit-speech"
version = "0.1.0"
description = "Japanese speech synthesis server"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
]

[dependency-groups]
dev = [
  "pytest",
  "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m5_petit_speech"]